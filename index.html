<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ESCAPE</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- ========================================= -->
    <!-- START SCREEN -->
    <!-- ========================================= -->

    <div id="startScreen">

        <div class="startContent">

            <h1>ESCAPE</h1>

            <p>
                A place to let the noise go.
            </p>

            <button id="startButton">
                ENTER
            </button>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- TOP HUD -->
    <!-- ========================================= -->

    <div id="hud">

        <div class="title">
            ESCAPE
        </div>


        <div class="quietCounter">

            QUIET

            <span id="quiet">
                0
            </span>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- HELP TEXT -->
    <!-- ========================================= -->

    <div id="hint">

        Find something that doesn't need
        your attention.

    </div>



    <!-- ========================================= -->
    <!-- INTERACTION PANEL -->
    <!-- ========================================= -->

    <div id="interactionPanel"
        class="hidden">

        <div id="interactionBox">

            <div id="interactionTitle">
                MESSAGE
            </div>


            <div id="interactionText">
                You have a new message.
            </div>


            <div id="interactionButtons">

                <button id="choiceOne">
                    LET IT GO
                </button>


                <button id="choiceTwo">
                    RESPOND
                </button>

            </div>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- QUIET SHOP -->
    <!-- ========================================= -->

    <div id="shop">

        <div class="shopTitle">
            YOUR SPACE
        </div>


        <button
            class="shopButton"
            id="plantButton">

            🌱 Plant

            <span>
                3 Quiet
            </span>

        </button>


        <button
            class="shopButton"
            id="lightButton">

            💡 Light

            <span>
                5 Quiet
            </span>

        </button>


        <button
            class="shopButton"
            id="benchButton">

            🪑 Bench

            <span>
                8 Quiet
            </span>

        </button>


        <button
            class="shopButton"
            id="moonButton">

            🌙 Moon

            <span>
                10 Quiet
            </span>

        </button>

    </div>



    <!-- ========================================= -->
    <!-- MESSAGE -->
    <!-- ========================================= -->

    <div id="message">

    </div>



    <!-- ========================================= -->
    <!-- END SCREEN -->
    <!-- ========================================= -->

    <div id="ending"
        class="hidden">

        <div class="endingContent">

            <h1 id="endingTitle">
                ESCAPE
            </h1>


            <p id="endingText">
                You made a quiet place for yourself.
            </p>


            <button id="restartButton">
                START AGAIN
            </button>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- THREE.JS GAME -->
    <!-- ========================================= -->

    <script
        type="module"
        src="game.js">
    </script>


</body>

</html>
